# Render Blueprint: deploys the whole Pizza 42 PoC (API + SPA) from this repo.
# Render dashboard > New > Blueprint > pick this repo.
services:
  # Order API (api/)
  - type: web
    name: pizza42-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AUTH0_DOMAIN
        value: yumm-pizzza.oktademo.cloud
      - key: AUTH0_AUDIENCE
        value: https://get-pizza42
      - key: ALLOWED_ORIGIN
        sync: false # the SPA's URL, no trailing slash (set after the first deploy)

  # React SPA (Vite build, hash routing so no rewrite rules needed)
  - type: web
    name: pizza42-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_AUTH0_DOMAIN
        value: yumm-pizzza.oktademo.cloud
      - key: VITE_AUTH0_AUDIENCE
        value: https://get-pizza42
      - key: VITE_AUTH0_CLIENT_ID
        sync: false # SPA Client ID from the Auth0 dashboard
      - key: VITE_API_URL
        sync: false # the API's Render URL, no trailing slash
